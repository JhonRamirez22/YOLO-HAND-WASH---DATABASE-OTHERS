<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HandWash Test - iPhone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; }
        #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #overlay { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .top-bar { background: rgba(0,0,0,0.7); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar h1 { font-size: 14px; letter-spacing: 2px; }
        #fps { color: #0f8; font-size: 12px; }
        #status { font-size: 11px; color: #f80; }
        .result-panel { background: rgba(0,0,0,0.8); padding: 16px; }
        .result-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(0,255,255,0.1); }
        .label { color: #888; }
        .value { color: #0ff; font-weight: bold; }
        .value.hand { color: #0f8; }
        .value.step { color: #ff0; }
        .value.none { color: #f44; }
        .start-btn { pointer-events: auto; margin: 0 16px 20px; padding: 16px; background: rgba(0,255,255,0.15); border: 2px solid #0ff; color: #0ff; font-size: 16px; font-family: inherit; letter-spacing: 3px; text-align: center; }
        .start-btn:active { background: rgba(0,255,255,0.4); }
        .start-btn.running { border-color: #f44; color: #f44; background: rgba(255,0,0,0.15); }
        #canvas { display: none; }
        .history { max-height: 120px; overflow-y: auto; font-size: 10px; color: #666; padding: 8px 16px; }
        .history div { padding: 1px 0; }
        .history .detected { color: #0f8; }
        .history .miss { color: #444; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="overlay">
        <div class="top-bar">
            <h1>HAND WASH TEST</h1>
            <div>
                <div id="fps">-- FPS</div>
                <div id="status">ESPERANDO...</div>
            </div>
        </div>

        <div class="history" id="history"></div>

        <div class="result-panel">
            <div class="result-row">
                <span class="label">MANO</span>
                <span class="value" id="r-hand">--</span>
            </div>
            <div class="result-row">
                <span class="label">CONFIANZA MANO</span>
                <span class="value" id="r-hand-conf">--</span>
            </div>
            <div class="result-row">
                <span class="label">PASO</span>
                <span class="value" id="r-step">--</span>
            </div>
            <div class="result-row">
                <span class="label">CONFIANZA PASO</span>
                <span class="value" id="r-step-conf">--</span>
            </div>
        </div>

        <button class="start-btn" id="startBtn" onclick="toggleCamera()">INICIAR CAMARA</button>
    </div>

    <script>
        const BACKEND = window.location.origin;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const fpsEl = document.getElementById('fps');
        const historyEl = document.getElementById('history');

        let running = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let sending = false;

        async function toggleCamera() {
            if (running) {
                running = false;
                btn.textContent = 'INICIAR CAMARA';
                btn.classList.remove('running');
                statusEl.textContent = 'DETENIDO';
                const stream = video.srcObject;
                if (stream) stream.getTracks().forEach(t => t.stop());
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                running = true;
                btn.textContent = 'DETENER';
                btn.classList.add('running');
                statusEl.textContent = 'CONECTANDO...';
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusEl.textContent = 'ENVIANDO FRAMES...';
                    sendFrame();
                };
            } catch (e) {
                statusEl.textContent = 'ERROR: ' + e.message;
            }
        }

        function sendFrame() {
            if (!running) return;

            if (!sending) {
                sending = true;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(async (blob) => {
                    if (!blob) { sending = false; return; }
                    const formData = new FormData();
                    formData.append('file', blob, 'frame.jpg');

                    try {
                        const res = await fetch(BACKEND + '/api/v1/infer', { method: 'POST', body: formData });
                        const data = await res.json();
                        updateResults(data);
                    } catch (e) {
                        statusEl.textContent = 'ERROR RED: ' + e.message;
                    }
                    sending = false;
                    if (running) requestAnimationFrame(sendFrame);
                }, 'image/jpeg', 0.6);
            } else {
                if (running) requestAnimationFrame(sendFrame);
            }

            // FPS counter
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                fpsEl.textContent = frameCount + ' FPS';
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        function updateResults(d) {
            const handEl = document.getElementById('r-hand');
            const handConfEl = document.getElementById('r-hand-conf');
            const stepEl = document.getElementById('r-step');
            const stepConfEl = document.getElementById('r-step-conf');

            handEl.textContent = d.manoDetectada ? 'DETECTADA' : 'NO';
            handEl.className = 'value ' + (d.manoDetectada ? 'hand' : 'none');
            handConfEl.textContent = d.manoConfianza ? d.manoConfianza.toFixed(3) : '--';
            handConfEl.className = 'value ' + (d.manoDetectada ? 'hand' : 'none');

            stepEl.textContent = d.pasoDetectado || '--';
            stepEl.className = 'value ' + (d.pasoDetectado ? 'step' : 'none');
            stepConfEl.textContent = d.pasoConfianza ? d.pasoConfianza.toFixed(3) : '--';
            stepConfEl.className = 'value ' + (d.pasoDetectado ? 'step' : 'none');

            // Add to history
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString('es-ES');
            if (d.manoDetectada) {
                entry.className = 'detected';
                entry.textContent = '[' + time + '] MANO ' + d.manoConfianza.toFixed(2) + ' | ' + (d.pasoDetectado || '?') + ' ' + (d.pasoConfianza ? d.pasoConfianza.toFixed(2) : '');
            } else {
                entry.className = 'miss';
                entry.textContent = '[' + time + '] ---';
            }
            historyEl.appendChild(entry);
            if (historyEl.children.length > 30) historyEl.removeChild(historyEl.firstChild);
            historyEl.scrollTop = historyEl.scrollHeight;
        }
    </script>
</body>
</html>
